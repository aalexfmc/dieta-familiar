<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradFit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="140" fill="url(#gradFit)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="12" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-dasharray="15 25" />
  
  <!-- Dynamic Athletic 'F' and Energy Waves -->
  <g transform="translate(10, 0) skewX(-12)">
    <!-- Main stem of F -->
    <path d="M190 130 V380" fill="none" stroke="#ffffff" stroke-width="50" stroke-linecap="round" />
    
    <!-- Top horizontal bar of F -->
    <path d="M190 155 H330" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" />
    
    <!-- Middle horizontal bar of F -->
    <path d="M190 255 H280" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" />
    
    <!-- Speed/Pulse curves representing movement & energy -->
    <!-- Wave 1: Neon Cyan/Green -->
    <path d="M340 160 C390 210, 395 300, 310 360" fill="none" stroke="#67e8f9" stroke-width="20" stroke-linecap="round" opacity="0.95" filter="url(#glow)" />
    <!-- Wave 2: Bright Yellow/Emerald -->
    <path d="M375 190 C425 240, 420 310, 345 380" fill="none" stroke="#a7f3d0" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
